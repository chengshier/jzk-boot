name: One-time phase3 storage interface fix

on:
  push:
    branches:
      - feat/jzk-v3.1-phase3-operations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Convert storeBytes to a Java 8 default method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crmeb-service/src/main/java/com/zbkj/service/service/jiuzhoukang/storage/JkFileStorageService.java')
          text = path.read_text(encoding='utf-8')
          old = '''    JkFileObjectResponse storeBytes(byte[] bytes, String originalName, String contentType, String businessType,
                                    Long businessId, Long ownerUserId, String accessLevel);'''
          new = '''    default JkFileObjectResponse storeBytes(byte[] bytes, String originalName, String contentType, String businessType,
                                                   Long businessId, Long ownerUserId, String accessLevel) {
        throw new UnsupportedOperationException("当前存储实现不支持直接写入字节");
    }'''
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/jk-phase3-interface-fix.yml').unlink()
          PY
      - name: Commit one-time patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: 兼容统一文件存储默认字节写入能力"
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
