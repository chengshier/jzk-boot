name: jk-v31-refund-discovery
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-refund-discovery.yml']
permissions:
  contents: write
jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Discover refund integration points
        shell: bash
        run: |
          mkdir -p docs/jzk-v3.1-gapfix
          {
            echo '# Refund integration discovery'
            echo
            echo '## Candidate files'
            find crmeb-* -type f \( -name '*.java' -o -name '*.xml' \) | grep -Ei 'refund|order.*service|service.*order' | sort | head -n 400 || true
            echo
            echo '## Refund completion and commission reverse references'
            grep -R -n -E 'CommissionReverseService|\.reverse\(|refund|Refund|退款|afterCrmebOrderCompleted|RetailOrderCommissionAdapter' crmeb-* --include='*.java' --include='*.xml' | head -n 1200 || true
            echo
            echo '## Order completion adapter call sites'
            grep -R -n 'afterCrmebOrderCompleted' crmeb-* --include='*.java' || true
          } > docs/jzk-v3.1-gapfix/refund-integration-discovery.txt
      - name: Commit discovery and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-refund-discovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/jzk-v3.1-gapfix/refund-integration-discovery.txt .github/workflows/jk-v31-refund-discovery.yml
          git commit -m 'docs(jzk-v3.1): 记录零售退款接入点扫描结果'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations