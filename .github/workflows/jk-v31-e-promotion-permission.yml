name: jk-v31-e-promotion-permission
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-e-promotion-permission.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Add permission constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crmeb-common/src/main/java/com/zbkj/common/constants/jiuzhoukang/JkV31PermissionCodes.java')
          s=p.read_text(encoding='utf-8')
          anchor='    public static final String ADMIN_PROMOTION_SCENE_MANAGE = "admin:jk:promotion:scene:manage";\n'
          line='    public static final String ADMIN_PROMOTION_EFFECT_VIEW = "admin:jk:promotion:effect:view";\n'
          if line not in s:
              if anchor not in s: raise SystemExit('anchor missing')
              s=s.replace(anchor,anchor+line,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/jk-v31-e-promotion-permission.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crmeb-common/src/main/java/com/zbkj/common/constants/jiuzhoukang/JkV31PermissionCodes.java .github/workflows/jk-v31-e-promotion-permission.yml
          git commit -m 'feat(jzk-v3.1-e): 补充推广效果查看权限常量'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
