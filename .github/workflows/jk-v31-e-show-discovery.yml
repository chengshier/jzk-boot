name: jk-v31-e-show-discovery
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-e-show-discovery.yml']
permissions:
  contents: write
jobs:
  show:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Print focused discovery evidence
        shell: bash
        run: |
          echo '=== CANDIDATE FILES ==='
          sed -n '1,220p' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt
          echo '=== RECEIVE/REFUND/RESTOCK ==='
          grep -n -Ei 'ReceiveException|refund|restock|stockFlow|changeStock' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt | head -n 450 || true
          echo '=== EXPORT/MINIO/PRIVATE FILE ==='
          grep -n -Ei 'ReportExport|Minio|privateFile|upload|export' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt | head -n 450 || true
          echo '=== PROMOTION EFFECT ==='
          grep -n -Ei 'Promotion|scan|visit|effect' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt | head -n 350 || true
          echo '=== SUBSCRIPTION ==='
          grep -n -Ei 'Subscription|subscribe|templateId|sendMessage' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt | head -n 450 || true
          echo '=== HEALTH AUTH/ACCESS/PRIVACY ==='
          grep -n -Ei 'Health|authorization|accessLog|privacy|revoke' docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt | head -n 500 || true
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-e-show-discovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/jk-v31-e-show-discovery.yml
          git commit -m 'chore(jzk-v3.1-e): 移除一次性审计日志工作流'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
      - name: Mark audit log for inspection
        run: exit 1
