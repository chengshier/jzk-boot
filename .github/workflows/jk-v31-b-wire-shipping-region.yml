name: jk-v31-b-wire-shipping-region
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-b-wire-shipping-region.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Wire selected address standard region into order snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          order = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/OrderServiceImpl.java')
          text = order.read_text(encoding='utf-8')
          old = '''        String verifyCode = "";\n        String userAddressStr = "";\n        if (request.getShippingType() == 1) { // 快递配送\n            if (request.getAddressId() <= 0) throw new CrmebException("请选择收货地址");\n            UserAddress userAddress = userAddressService.getById(request.getAddressId());\n            if (ObjectUtil.isNull(userAddress) || userAddress.getIsDel()) {\n                throw new CrmebException("收货地址有误");\n            }\n            request.setRealName(userAddress.getRealName());\n            request.setPhone(userAddress.getPhone());\n            userAddressStr = userAddress.getProvince() + userAddress.getCity() + userAddress.getDistrict() + userAddress.getDetail();\n'''
          new = '''        String verifyCode = "";\n        String userAddressStr = "";\n        UserAddress selectedUserAddress = null;\n        if (request.getShippingType() == 1) { // 快递配送\n            if (request.getAddressId() <= 0) throw new CrmebException("请选择收货地址");\n            selectedUserAddress = userAddressService.getById(request.getAddressId());\n            if (ObjectUtil.isNull(selectedUserAddress) || selectedUserAddress.getIsDel()\n                    || !user.getUid().equals(selectedUserAddress.getUid())) {\n                throw new CrmebException("收货地址有误");\n            }\n            request.setRealName(selectedUserAddress.getRealName());\n            request.setPhone(selectedUserAddress.getPhone());\n            userAddressStr = selectedUserAddress.getProvince() + selectedUserAddress.getCity()\n                    + selectedUserAddress.getDistrict() + selectedUserAddress.getDetail();\n'''
          if old not in text:
              raise SystemExit('OrderService address block not found')
          text = text.replace(old, new, 1)
          old = '''        storeOrder.setUserAddress(userAddressStr);\n        // 如果是自提\n'''
          new = '''        storeOrder.setUserAddress(userAddressStr);\n        if (selectedUserAddress != null) {\n            // 只固化到本单；不得反向覆盖 eb_user.jk_region_code。\n            storeOrder.setJkShippingAddressId(selectedUserAddress.getId());\n            storeOrder.setJkShippingRegionCode(selectedUserAddress.getJkRegionCode());\n        }\n        // 如果是自提\n'''
          if old not in text:
              raise SystemExit('StoreOrder user address block not found')
          order.write_text(text.replace(old, new, 1), encoding='utf-8')

          address = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/UserAddressServiceImpl.java')
          text = address.read_text(encoding='utf-8')
          old = 'import com.zbkj.service.service.UserService;\n'
          new = 'import com.zbkj.service.service.UserService;\nimport com.zbkj.service.service.jiuzhoukang.region.JkRegionService;\n'
          if old not in text:
              raise SystemExit('UserAddressService import anchor not found')
          text = text.replace(old, new, 1)
          old = '''    @Autowired\n    private UserService userService;\n'''
          new = '''    @Autowired\n    private UserService userService;\n\n    @Autowired\n    private JkRegionService jkRegionService;\n'''
          if old not in text:
              raise SystemExit('UserAddressService field anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('UserAddress::getCity, UserAddress::getDistrict, UserAddress::getDetail, UserAddress::getIsDefault);',
                              'UserAddress::getCity, UserAddress::getDistrict, UserAddress::getDetail, UserAddress::getJkRegionCode, UserAddress::getIsDefault);')
          old = '''        if (request.getAddress().getCityId() > 0 && StrUtil.isNotBlank(request.getAddress().getDistrict())) {\n            checkCity(userAddress.getCityId());\n        }\n        userAddress.setUid(userService.getUserIdException());\n'''
          new = '''        if (request.getAddress().getCityId() > 0 && StrUtil.isNotBlank(request.getAddress().getDistrict())) {\n            checkCity(userAddress.getCityId());\n        }\n        if (StrUtil.isNotBlank(request.getJkRegionCode())) {\n            // 必须由九州康区域级联组件提交有效编码；禁止只凭中文详细地址模糊解析。\n            jkRegionService.getRegionPath(request.getJkRegionCode().trim());\n            userAddress.setJkRegionCode(request.getJkRegionCode().trim());\n        } else {\n            userAddress.setJkRegionCode(null);\n        }\n        userAddress.setUid(userService.getUserIdException());\n'''
          if old not in text:
              raise SystemExit('UserAddressService validation anchor not found')
          address.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-b-wire-shipping-region.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crmeb-service/src/main/java/com/zbkj/service/service/impl/OrderServiceImpl.java \
                  crmeb-service/src/main/java/com/zbkj/service/service/impl/UserAddressServiceImpl.java \
                  .github/workflows/jk-v31-b-wire-shipping-region.yml
          git commit -m 'feat(jzk-v3.1-b): 接入本单标准收货区域快照主链'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
