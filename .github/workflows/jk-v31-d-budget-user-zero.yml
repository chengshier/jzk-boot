name: jk-v31-d-budget-user-zero
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-d-budget-user-zero.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Normalize budget user key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/JkCommissionLimitServiceImpl.java')
          s=p.read_text(encoding='utf-8')
          old='''        JkCommissionLimitUsage usage = usageDao.selectForUpdate(type, ruleId, userId, periodKey);\n        if (usage != null) return usage;\n        JkCommissionLimitUsage created = new JkCommissionLimitUsage()\n                .setUsageType(type).setRuleId(ruleId).setUserId(userId).setPeriodKey(periodKey)\n'''
          new='''        Long dbUserId = userId == null ? 0L : userId;\n        JkCommissionLimitUsage usage = usageDao.selectForUpdate(type, ruleId, dbUserId, periodKey);\n        if (usage != null) return usage;\n        JkCommissionLimitUsage created = new JkCommissionLimitUsage()\n                .setUsageType(type).setRuleId(ruleId).setUserId(dbUserId).setPeriodKey(periodKey)\n'''
          if old not in s: raise SystemExit('lock create anchor missing')
          s=s.replace(old,new,1)
          old='usage = usageDao.selectForUpdate(type, ruleId, userId, periodKey);'
          new='usage = usageDao.selectForUpdate(type, ruleId, dbUserId, periodKey);'
          if old not in s: raise SystemExit('reselect anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/jk-v31-d-budget-user-zero.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/JkCommissionLimitServiceImpl.java .github/workflows/jk-v31-d-budget-user-zero.yml
          git commit -m 'fix(jzk-v3.1-d): 规范规则预算公共占用唯一键'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
