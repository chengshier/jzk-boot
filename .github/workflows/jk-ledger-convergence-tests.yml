name: JZK ledger convergence tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/performance/**'
      - 'crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/profit/**'
      - 'crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionTriggerServiceImpl.java'
      - 'crmeb-service/src/main/java/com/zbkj/service/service/jiuzhoukang/performance/**'
      - 'crmeb-service/src/main/java/com/zbkj/service/service/jiuzhoukang/profit/**'
      - 'crmeb-service/src/test/java/com/zbkj/service/service/impl/jiuzhoukang/performance/**'
      - 'crmeb-service/src/test/java/com/zbkj/service/service/impl/jiuzhoukang/profit/**'
      - 'crmeb-service/src/test/java/com/zbkj/service/service/impl/jiuzhoukang/commission/**'
      - '.github/workflows/jk-ledger-convergence-tests.yml'
  workflow_dispatch:

concurrency:
  group: jk-ledger-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run ledger convergence regression tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl crmeb-service -am \
            -Dtest=JkPerformanceServiceImplTest,JkOperationProfitServiceImplTest,CommissionTriggerServiceImplTransferReturnTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false \
            test 2>&1 | tee ledger-regression-test.log
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-regression-test-log
          path: ledger-regression-test.log
          retention-days: 3
