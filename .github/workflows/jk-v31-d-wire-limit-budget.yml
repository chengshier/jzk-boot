name: jk-v31-d-wire-limit-budget
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-d-wire-limit-budget.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Wire period cap and total budget into real dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java')
          s=p.read_text(encoding='utf-8')
          old='import com.zbkj.service.service.jiuzhoukang.commission.CommissionScenarioService;\n'
          new=old+'import com.zbkj.service.service.jiuzhoukang.commission.JkCommissionLimitService;\n'
          if old not in s: raise SystemExit('import anchor missing')
          s=s.replace(old,new,1)
          old='    @Autowired private CommissionAccountService accountService;\n'
          new=old+'    @Autowired private JkCommissionLimitService limitService;\n'
          if old not in s: raise SystemExit('field anchor missing')
          s=s.replace(old,new,1)
          old='''            if (!"MATCHED".equals(trial.getMatchStatus()) || money(trial.getCappedAmount()).signum() <= 0) continue;\n            hasPayableMatch = true;\n            String actionKey = request.getSourceType() + ":" + request.getSourceItemId() + ":" + trial.getBeneficiaryUserId()\n                    + ":" + trial.getRewardType() + ":" + trial.getRuleId() + ":" + trial.getRuleVersionNo();\n            if (recordDao.selectOne(new LambdaQueryWrapper<JkCommissionRecord>()\n                    .eq(JkCommissionRecord::getIdempotencyKey, actionKey).last("limit 1")) != null) continue;\n            Date now = new Date();\n'''
          new='''            if (!"MATCHED".equals(trial.getMatchStatus()) || money(trial.getCappedAmount()).signum() <= 0) continue;\n            String actionKey = request.getSourceType() + ":" + request.getSourceItemId() + ":" + trial.getBeneficiaryUserId()\n                    + ":" + trial.getRewardType() + ":" + trial.getRuleId() + ":" + trial.getRuleVersionNo();\n            if (recordDao.selectOne(new LambdaQueryWrapper<JkCommissionRecord>()\n                    .eq(JkCommissionRecord::getIdempotencyKey, actionKey).last("limit 1")) != null) continue;\n            JkCommissionRule matchedRule = ruleDao.selectById(trial.getRuleId());\n            JkCommissionLimitService.ReservationResult reservation = limitService.reserve(matchedRule,\n                    trial.getBeneficiaryUserId(), request.getBusinessTime(), trial.getCappedAmount(), "COMMISSION_LIMIT:" + actionKey);\n            BigDecimal approvedAmount = money(reservation.getApprovedAmount());\n            trial.getExplanations().add(reservation.getResultMessage());\n            if (approvedAmount.signum() <= 0) {\n                trial.setMatchStatus("LIMIT_EXHAUSTED").setReasonCode(reservation.getResultCode()).setCappedAmount(BigDecimal.ZERO);\n                writeMatchLog(eventKey + ":LIMIT:" + trial.getRuleId(), request, trial);\n                continue;\n            }\n            trial.setCappedAmount(approvedAmount);\n            hasPayableMatch = true;\n            Date now = new Date();\n'''
          if old not in s: raise SystemExit('dispatch anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/jk-v31-d-wire-limit-budget.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java .github/workflows/jk-v31-d-wire-limit-budget.yml
          git commit -m 'feat(jzk-v3.1-d): 在真实分发前占用周期封顶与总预算'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
