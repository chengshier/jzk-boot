name: JZK post-merge hardening verify

on:
  push:
    branches:
      - fix/jzk-v3.1-post-merge-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile all modules
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests compile 2>&1 | tee maven-post-merge.log
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-compile-log
          path: maven-post-merge.log
          retention-days: 3
