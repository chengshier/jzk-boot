name: jk-v31-confirmed-business-rules-patch
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-confirmed-business-rules-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Apply confirmed business rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          branch_doc_marker = '## 九、已确认商业口径（2026-07-31）'

          # Promotion service contract.
          replace_once(
              'crmeb-service/src/main/java/com/zbkj/service/service/jiuzhoukang/promotion/JkPromotionEffectService.java',
              '    JkPromotionEffectEvent recordRetailCompleted(JkRetailOrderAttribution attribution, BigDecimal amount, Date occurredAt);\n',
              '    JkPromotionEffectEvent recordRetailCompleted(JkRetailOrderAttribution attribution, BigDecimal amount, Date occurredAt);\n'
              '    JkPromotionEffectEvent recordRetailRefund(JkRetailOrderAttribution attribution, BigDecimal refundAmount,\n'
              '                                               BigDecimal beforeRefundedAmount, String requestNo, Date occurredAt);\n'
          )

          # Promotion reverse event and net summary.
          p = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/promotion/JkPromotionEffectServiceImpl.java')
          s = p.read_text(encoding='utf-8')
          anchor = '''        return insert(event);\n    }\n\n    @Override\n    public List<JkPromotionEffectEvent> list'''
          method = '''        return insert(event);\n    }\n\n    @Override\n    @Transactional(rollbackFor = Exception.class)\n    public JkPromotionEffectEvent recordRetailRefund(JkRetailOrderAttribution attribution,\n                                                     BigDecimal refundAmount, BigDecimal beforeRefundedAmount,\n                                                     String requestNo, Date occurredAt) {\n        if (attribution == null || attribution.getId() == null || attribution.getOrderInfoId() == null) {\n            throw new IllegalArgumentException("零售订单归属快照不能为空");\n        }\n        if (refundAmount == null || refundAmount.signum() <= 0) {\n            throw new IllegalArgumentException("推广退款冲减金额必须大于零");\n        }\n        if (StrUtil.isBlank(requestNo)) throw new IllegalArgumentException("退款requestNo不能为空");\n        String normalizedRequestNo = requestNo.trim();\n        String key = "PROMOTION_RETAIL_REFUND:" + attribution.getOrderInfoId() + ":" + normalizedRequestNo;\n        JkPromotionEffectEvent existing = findByKey(key);\n        if (existing != null) return existing;\n\n        BigDecimal before = money(beforeRefundedAmount);\n        BigDecimal refund = money(refundAmount);\n        BigDecimal after = before.add(refund).setScale(2, RoundingMode.HALF_UP);\n        BigDecimal itemPaid = money(attribution.getItemPaidAmount());\n        Map<String, Object> metadata = new LinkedHashMap<String, Object>();\n        metadata.put("beforeRefundedAmount", before);\n        metadata.put("refundAmount", refund);\n        metadata.put("afterRefundedAmount", after);\n        metadata.put("itemPaidAmount", itemPaid);\n        metadata.put("fullRefund", itemPaid.signum() > 0 && after.compareTo(itemPaid) >= 0);\n\n        Long promoter = attribution.getDirectParentUserId() != null\n                ? attribution.getDirectParentUserId() : attribution.getCountyAgentUserId();\n        JkPromotionEffectEvent event = base("RETAIL_REFUND", key, normalizedRequestNo)\n                .setSceneCode(sceneFromSnapshot(attribution)).setPromoterUserId(promoter)\n                .setVisitorUserId(attribution.getBuyerUserId()).setSourceType("RETAIL_ORDER_REFUND")\n                .setSourceId(attribution.getOrderId()).setSourceItemId(attribution.getOrderInfoId())\n                .setSourceNo(attribution.getOrderNo()).setAmount(refund)\n                .setAttributionSnapshotJson(JSONUtil.toJsonStr(attribution))\n                .setMetadataJson(JSONUtil.toJsonStr(metadata))\n                .setOccurredAt(occurredAt == null ? new Date() : occurredAt);\n        return insert(event);\n    }\n\n    @Override\n    public List<JkPromotionEffectEvent> list'''
          if anchor not in s:
              raise SystemExit('promotion refund insertion anchor missing')
          s = s.replace(anchor, method, 1)
          start = s.index('    @Override\n    public Map<String, Object> summary(')
          end = s.index('    private JkPromotionEffectEvent base(', start)
          summary = '''    @Override\n    public Map<String, Object> summary(String sceneCode, Long promoterUserId, Date startTime, Date endTime) {\n        List<JkPromotionEffectEvent> events = list(sceneCode, promoterUserId, null, startTime, endTime);\n        int openCount = 0;\n        Set<Long> visitors = new HashSet<Long>();\n        Set<String> scenes = new HashSet<String>();\n        Set<Long> promoters = new HashSet<Long>();\n        Map<String, BigDecimal> orderNetAmounts = new LinkedHashMap<String, BigDecimal>();\n\n        for (JkPromotionEffectEvent event : events) {\n            if ("OPEN".equals(event.getEventType())) {\n                openCount++;\n                if (event.getVisitorUserId() != null) visitors.add(event.getVisitorUserId());\n            }\n            if ("RETAIL_COMPLETED".equals(event.getEventType()) || "RETAIL_REFUND".equals(event.getEventType())) {\n                String orderKey = event.getSourceId() != null ? "ID:" + event.getSourceId()\n                        : "NO:" + StrUtil.blankToDefault(event.getSourceNo(), event.getEventNo());\n                BigDecimal current = orderNetAmounts.get(orderKey);\n                if (current == null) current = BigDecimal.ZERO;\n                BigDecimal amount = money(event.getAmount());\n                orderNetAmounts.put(orderKey, "RETAIL_REFUND".equals(event.getEventType())\n                        ? current.subtract(amount) : current.add(amount));\n            }\n            if (StrUtil.isNotBlank(event.getSceneCode())) scenes.add(event.getSceneCode());\n            if (event.getPromoterUserId() != null) promoters.add(event.getPromoterUserId());\n        }\n\n        int completedOrderCount = 0;\n        BigDecimal completedAmount = BigDecimal.ZERO;\n        for (BigDecimal value : orderNetAmounts.values()) {\n            BigDecimal net = money(value).max(BigDecimal.ZERO);\n            if (net.signum() > 0) completedOrderCount++;\n            completedAmount = completedAmount.add(net);\n        }\n\n        BigDecimal openConversionRate = openCount == 0 ? null\n                : new BigDecimal(completedOrderCount).multiply(new BigDecimal("100"))\n                    .divide(new BigDecimal(openCount), 2, RoundingMode.HALF_UP);\n        BigDecimal visitorConversionRate = visitors.isEmpty() ? null\n                : new BigDecimal(completedOrderCount).multiply(new BigDecimal("100"))\n                    .divide(new BigDecimal(visitors.size()), 2, RoundingMode.HALF_UP);\n\n        Map<String, Object> result = new LinkedHashMap<String, Object>();\n        result.put("openCount", openCount);\n        result.put("identifiedVisitorCount", visitors.size());\n        result.put("completedOrderCount", completedOrderCount);\n        result.put("completedAmount", completedAmount.setScale(2, RoundingMode.HALF_UP));\n        result.put("sceneCount", scenes.size());\n        result.put("promoterCount", promoters.size());\n        result.put("openConversionRate", openConversionRate);\n        result.put("visitorConversionRate", visitorConversionRate);\n        result.put("conversionRate", openConversionRate);\n        result.put("notice", "有效成交按后端完成事件减退款反向事件统计；部分退款只减金额，累计全额退款后订单不再计为有效成交。客户端只能上报打开事件。");\n        return result;\n    }\n\n'''
          s = s[:start] + summary + s[end:]
          p.write_text(s, encoding='utf-8')

          # Use the same trusted refund completion adapter for promotion reversals.
          p = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionTriggerServiceImpl.java')
          s = p.read_text(encoding='utf-8')
          old = 'import com.zbkj.service.service.jiuzhoukang.profit.JkOperationProfitService;\n'
          new = old + 'import com.zbkj.service.service.jiuzhoukang.promotion.JkPromotionEffectService;\n'
          if old not in s: raise SystemExit('trigger promotion import anchor missing')
          s = s.replace(old, new, 1)
          old = '    @Autowired private JkOperationProfitService profitService;\n'
          new = old + '    @Autowired private JkPromotionEffectService promotionEffectService;\n'
          if old not in s: raise SystemExit('trigger promotion field anchor missing')
          s = s.replace(old, new, 1)
          old = '''            JkRetailOrderAttribution attribution = allocation.getAttribution();\n            BigDecimal remainingBaseBefore = safe(attribution.getItemPaidAmount())\n'''
          new = '''            JkRetailOrderAttribution attribution = allocation.getAttribution();\n            promotionEffectService.recordRetailRefund(attribution, allocation.getRefundBaseAmount(),\n                    allocation.getBeforeRefundedAmount(), requestNo + ":" + attribution.getOrderInfoId(), new Date());\n            BigDecimal remainingBaseBefore = safe(attribution.getItemPaidAmount())\n'''
          if old not in s: raise SystemExit('trigger refund allocation anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Template request exposes the already-supported total budget.
          replace_once(
              'crmeb-common/src/main/java/com/zbkj/common/request/jiuzhoukang/JkCommissionTemplateSaveRequest.java',
              '    private BigDecimal perUserPeriodCap;\n',
              '    private BigDecimal perUserPeriodCap;\n    private BigDecimal totalBudget;\n'
          )

          # Template validation: configured rewards and optional limits must be strictly positive.
          p = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/JkCommissionTemplateServiceImpl.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('        save.setPerUserPeriodCap(request.getPerUserPeriodCap());\n',
                        '        save.setPerUserPeriodCap(request.getPerUserPeriodCap());\n        save.setTotalBudget(request.getTotalBudget());\n', 1)
          start = s.index('    private void validateReward(')
          end = s.index('    private Map<String, Object> advanced(', start)
          validation = '''    private void validateReward(JkCommissionTemplateSaveRequest request, TemplateDefinition template) {\n        if (request.getRewardValue() == null || request.getRewardValue().compareTo(BigDecimal.ZERO) <= 0) {\n            throw new IllegalArgumentException("奖励数值必须大于 0；未配置时请保持为空而不是填写 0");\n        }\n        positiveIfPresent(request.getPerOrderCap(), "单笔封顶");\n        positiveIfPresent(request.getPerUserPeriodCap(), "周期封顶");\n        positiveIfPresent(request.getTotalBudget(), "规则总预算");\n        if (template.tier) {\n            if (request.getPerformanceThreshold() == null || request.getPerformanceThreshold().compareTo(BigDecimal.ZERO) <= 0) {\n                throw new IllegalArgumentException("阶梯奖励必须填写大于 0 的业绩门槛");\n            }\n            if (StrUtil.isBlank(request.getPeriodType())) throw new IllegalArgumentException("阶梯奖励必须选择统计周期");\n            return;\n        }\n        if (!Arrays.asList("PERCENT", "FIXED_PER_ORDER", "FIXED_PER_ITEM").contains(request.getRewardMode())) {\n            throw new IllegalArgumentException("奖励方式不受支持");\n        }\n    }\n\n    private void positiveIfPresent(BigDecimal value, String name) {\n        if (value != null && value.compareTo(BigDecimal.ZERO) <= 0) {\n            throw new IllegalArgumentException(name + "填写后必须大于 0；留空表示不限制");\n        }\n    }\n\n'''
          s = s[:start] + validation + s[end:]
          p.write_text(s, encoding='utf-8')

          # Publishing requires a real reward value, a start time and positive optional limits.
          p = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionRuleServiceImpl.java')
          s = p.read_text(encoding='utf-8')
          old = '''        if ("PERCENT".equals(rule.getCalculationType()) && rule.getRate() == null) throw new IllegalArgumentException("比例规则必须填写比例");\n        if ("FIXED_PER_ORDER".equals(rule.getCalculationType()) && rule.getFixedAmount() == null) throw new IllegalArgumentException("固定规则必须填写金额");\n        if ("FIXED_PER_QUANTITY".equals(rule.getCalculationType()) && rule.getUnitAmount() == null) throw new IllegalArgumentException("按数量规则必须填写单位金额");\n        if (request.getEffectiveEndTime() != null && !request.getEffectiveEndTime().after(request.getEffectiveStartTime())) throw new IllegalArgumentException("失效时间必须晚于生效时间");\n'''
          new = '''        if (("PERCENT".equals(rule.getCalculationType()) || "TIER_PERCENT".equals(rule.getCalculationType()))\n                && (rule.getRate() == null || rule.getRate().signum() <= 0)) throw new IllegalArgumentException("比例规则必须填写大于 0 的比例");\n        if (("FIXED_PER_ORDER".equals(rule.getCalculationType()) || "FIXED_PER_ITEM".equals(rule.getCalculationType()))\n                && (rule.getFixedAmount() == null || rule.getFixedAmount().signum() <= 0)) throw new IllegalArgumentException("固定规则必须填写大于 0 的金额");\n        if ("FIXED_PER_QUANTITY".equals(rule.getCalculationType())\n                && (rule.getUnitAmount() == null || rule.getUnitAmount().signum() <= 0)) throw new IllegalArgumentException("按数量规则必须填写大于 0 的单位金额");\n        if (rule.getPerOrderCap() != null && rule.getPerOrderCap().signum() <= 0) throw new IllegalArgumentException("单笔封顶填写后必须大于 0，留空表示不限制");\n        if (rule.getPerUserPeriodCap() != null && rule.getPerUserPeriodCap().signum() <= 0) throw new IllegalArgumentException("周期封顶填写后必须大于 0，留空表示不限制");\n        if (rule.getTotalBudget() != null && rule.getTotalBudget().signum() <= 0) throw new IllegalArgumentException("规则总预算填写后必须大于 0，留空表示不限制");\n        if (request.getEffectiveStartTime() == null) throw new IllegalArgumentException("生效时间不能为空");\n        if (request.getEffectiveEndTime() != null && !request.getEffectiveEndTime().after(request.getEffectiveStartTime())) throw new IllegalArgumentException("失效时间必须晚于生效时间");\n'''
          if old not in s: raise SystemExit('publish validation anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Menu SQL: never leave visible empty group routes that can be chosen as the first page.
          p = Path('sql/jiuzhoukang/fix/jk_v31_phase3_menu_permission_patch.sql')
          s = p.read_text(encoding='utf-8')
          marker = '-- 清理本补丁产生或历史遗留的空九州康分组目录'
          if marker not in s:
              insert_at = s.rfind('SELECT id,pid,name,perms,component,menu_type,is_show,is_delete')
              if insert_at < 0: raise SystemExit('menu final select anchor missing')
              cleanup = '''-- 清理本补丁产生或历史遗留的空九州康分组目录，避免一级入口跳入不存在路由。\nUPDATE eb_system_menu m\nLEFT JOIN eb_system_menu c ON c.pid=m.id AND c.is_delete=0\nSET m.is_show=0,m.is_delete=1,m.update_time=@now\nWHERE m.pid=@jk_root_id AND m.menu_type='M'\n  AND m.component LIKE '/operation/jzk/group/%' AND c.id IS NULL;\n\n'''
              s = s[:insert_at] + cleanup + s[insert_at:]
              p.write_text(s, encoding='utf-8')

          # Permanent guards.
          p = Path('.github/workflows/jk-v31-gapfix-guards.yml')
          s = p.read_text(encoding='utf-8')
          anchor = "          grep -q 'recordRetailCompleted' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java\n"
          extra = anchor + "          grep -q 'recordRetailRefund' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionTriggerServiceImpl.java\n          grep -q 'visitorConversionRate' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/promotion/JkPromotionEffectServiceImpl.java\n          grep -q '奖励数值必须大于 0' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/JkCommissionTemplateServiceImpl.java\n"
          if "grep -q 'recordRetailRefund'" not in s:
              if anchor not in s: raise SystemExit('guard anchor missing')
              p.write_text(s.replace(anchor, extra, 1), encoding='utf-8')

          # Confirmed rules in delivery docs.
          confirmed = '''\n## 九、已确认商业口径（2026-07-31）\n\n- 线上零售计奖基数为逐订单明细商品实付净额，已排除运费，并包含优惠券、积分、满减及其他优惠分摊；最后一条明细吸收分摊尾差。\n- 比例、固定金额和阶梯奖励必须配置大于 0 的真实数值后才能发布；不预填业务数值。固定金额与比例在单条规则中互斥。\n- 单笔封顶、用户周期封顶和规则总预算均为可选；留空表示不限制，填写后必须大于 0，不允许用 0 表示未配置。\n- 生效开始时间必填、结束时间可空；发布版本不可直接修改，不追溯重算历史业务，停用仅影响后续业务。\n- 退款后不覆盖原归属、佣金、结算或提现记录；按明细实付净额比例生成冲正，累计全额退款时全部冲正，已提现部分形成后续待抵扣。\n- 推广打开和已识别访客不因退款删除；推广有效金额按完成金额减退款金额统计，部分退款保留一笔有效订单，累计全额退款后该订单不再计为有效成交。\n- 推广报表同时提供打开转化率和访客转化率；分母为 0 时返回空值，由页面显示 `--`。\n- 推广退款只允许后端真实退款完成链生成 `RETAIL_REFUND` 反向事件，客户端不得提交成交或退款事件。\n'''
          p = Path('docs/jzk-v3.1-gapfix/V3.1_GAPFIX_FINAL_DELIVERY.md')
          s = p.read_text(encoding='utf-8')
          if branch_doc_marker not in s:
              p.write_text(s.rstrip() + '\n' + confirmed, encoding='utf-8')

          for doc, title, bullets in [
              ('docs/jzk-v3.1-gapfix/BATCH_C_BUSINESS_PLAN_COMMISSION_TEMPLATE.md', '## 8. 已确认奖励规则口径',
               ['商品实付净额排除运费并按明细分摊。','奖励数值必须大于 0；固定金额与比例单条规则互斥。','封顶与总预算留空表示不限制，填写后必须大于 0。','生效开始时间必填，发布版本不追溯历史业务。']),
              ('docs/jzk-v3.1-gapfix/BATCH_E_PHASE3_REAL_CLOSURE.md', '## 8. 已确认退款与推广净效果口径',
               ['部分退款只冲减有效成交金额；累计全额退款后有效订单数归零。','打开与访客事件不删除。','退款由后端统一退款完成链生成 RETAIL_REFUND 反向事件。','同时输出打开转化率与访客转化率，分母为 0 返回空值。']),
              ('docs/jzk-v3.1-gapfix/BATCH_A_DATABASE_MENU_PERMISSION.md', '## 8. 菜单空目录防护补充',
               ['菜单补丁执行结束时自动隐藏并逻辑删除无子节点的 `/operation/jzk/group/%` 目录，避免一级九州康入口选中不存在路由。'])
          ]:
              p = Path(doc); s = p.read_text(encoding='utf-8')
              if title not in s:
                  block = '\n\n' + title + '\n\n' + '\n'.join('- ' + x for x in bullets) + '\n'
                  p.write_text(s.rstrip() + block, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-confirmed-business-rules-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(jzk-v3.1): 按确认口径收口奖励与退款净效果'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations