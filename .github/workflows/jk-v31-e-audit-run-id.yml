name: jk-v31-e-audit-run-id
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-e-audit-run-id.yml']
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Print report
        run: cat docs/jzk-v3.1-gapfix/phase3-real-closure-discovery.txt
      - name: Persist run id and remove workflow
        run: |
          echo "$GITHUB_RUN_ID" > docs/jzk-v3.1-gapfix/last-phase3-audit-run-id.txt
          rm -f .github/workflows/jk-v31-e-audit-run-id.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/jzk-v3.1-gapfix/last-phase3-audit-run-id.txt .github/workflows/jk-v31-e-audit-run-id.yml
          git commit -m 'chore(jzk-v3.1-e): 记录第三批审计运行编号'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
