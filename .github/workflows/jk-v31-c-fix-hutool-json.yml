name: jk-v31-c-fix-hutool-json
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-c-fix-hutool-json.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Fix Hutool JSON API compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/business/JkBusinessRulePlanServiceImpl.java')
          text = plan.read_text(encoding='utf-8')
          old = 'try { return JSONUtil.toList(json, String.class); } catch (Exception ignored) { return new ArrayList<String>(); }'
          new = 'try { return JSONUtil.toList(JSONUtil.parseArray(json), String.class); } catch (Exception ignored) { return new ArrayList<String>(); }'
          if old not in text:
              raise SystemExit('plan JSON anchor missing')
          plan.write_text(text.replace(old, new, 1), encoding='utf-8')

          scenario = Path('crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java')
          text = scenario.read_text(encoding='utf-8')
          old = '''            java.util.List<Integer> productIds = scope.getBeanList("productIds", Integer.class);\n            if (productIds != null && !productIds.isEmpty() && (request.getProductId() == null || !productIds.contains(request.getProductId()))) return "商品不在规则适用范围";\n            java.util.List<String> regionCodes = scope.getBeanList("regionCodes", String.class);\n            if (regionCodes != null && !regionCodes.isEmpty() && (request.getRegionCode() == null || !regionCodes.contains(request.getRegionCode()))) return "区域不在规则适用范围";\n'''
          new = '''            java.util.List<Integer> productIds = scope.getJSONArray("productIds") == null\n                    ? new java.util.ArrayList<Integer>()\n                    : JSONUtil.toList(scope.getJSONArray("productIds"), Integer.class);\n            if (!productIds.isEmpty() && (request.getProductId() == null || !productIds.contains(request.getProductId()))) return "商品不在规则适用范围";\n            java.util.List<String> regionCodes = scope.getJSONArray("regionCodes") == null\n                    ? new java.util.ArrayList<String>()\n                    : JSONUtil.toList(scope.getJSONArray("regionCodes"), String.class);\n            if (!regionCodes.isEmpty() && (request.getRegionCode() == null || !regionCodes.contains(request.getRegionCode()))) return "区域不在规则适用范围";\n'''
          if old not in text:
              raise SystemExit('scenario JSON anchor missing')
          scenario.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-c-fix-hutool-json.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/business/JkBusinessRulePlanServiceImpl.java \
                  crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java \
                  .github/workflows/jk-v31-c-fix-hutool-json.yml
          git commit -m 'fix(jzk-v3.1-c): 兼容当前Hutool JSON API'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
