name: jk-v31-final-backend-verify
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-final-backend-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run backend build and guard assertions
        shell: bash
        run: |
          set +e
          mkdir -p docs/jzk-v3.1-gapfix/verification
          rm -f docs/jzk-v3.1-gapfix/verification/backend-PASS.txt docs/jzk-v3.1-gapfix/verification/backend-FAIL.txt
          mvn -B -ntp -DskipTests package > /tmp/backend.log 2>&1
          build_code=$?
          guard_code=0
          files=$(find sql/jiuzhoukang/v3.1-gapfix -type f -name '*.sql' -print)
          grep -n -E 'INSERT[[:space:]]+INTO[[:space:]]+eb_system_menu[^;]*(\bpath\b|\bis_del\b)' $files >/tmp/guard-errors.txt 2>&1 && guard_code=1
          grep -n -E 'jk_business_permission[^;]*parent_code' $files >>/tmp/guard-errors.txt 2>&1 && guard_code=1
          grep -R -n -E 'jk_user_region_profile|用户服务区域' sql/jiuzhoukang/v3.1-gapfix crmeb-* >>/tmp/guard-errors.txt 2>&1 && guard_code=1
          grep -q 'rule.setStatus(false)' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionRuleServiceImpl.java || guard_code=1
          grep -q 'setPublishStatus("DRAFT")' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionRuleServiceImpl.java || guard_code=1
          grep -q 'FOR UPDATE' crmeb-service/src/main/java/com/zbkj/service/dao/jiuzhoukang/JkCommissionLimitUsageDao.java || guard_code=1
          grep -q 'recordRetailCompleted' crmeb-service/src/main/java/com/zbkj/service/service/impl/jiuzhoukang/commission/CommissionScenarioServiceImpl.java || guard_code=1
          if [ "$build_code" -eq 0 ] && [ "$guard_code" -eq 0 ]; then
            {
              echo 'status=PASS'
              echo 'scope=Maven package with tests skipped + V3.1 prohibited-pattern guards'
              echo "commit=$(git rev-parse HEAD)"
              echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              grep -E 'BUILD SUCCESS' /tmp/backend.log | tail -n 1
              echo 'note=Development self-check only; not MySQL/Token/WeChat/MinIO/UAT acceptance.'
            } > docs/jzk-v3.1-gapfix/verification/backend-PASS.txt
          else
            {
              echo 'status=FAIL'
              echo "build_exit=$build_code"
              echo "guard_exit=$guard_code"
              echo "commit=$(git rev-parse HEAD)"
              echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo '--- compiler errors ---'
              grep -n -E '\[ERROR\]|COMPILATION ERROR|BUILD FAILURE' /tmp/backend.log | tail -n 200
              echo '--- guard errors ---'
              cat /tmp/guard-errors.txt 2>/dev/null
            } > docs/jzk-v3.1-gapfix/verification/backend-FAIL.txt
          fi
          exit 0
      - name: Commit marker and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-final-backend-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/jzk-v3.1-gapfix/verification .github/workflows/jk-v31-final-backend-verify.yml
          git commit -m 'test(jzk-v3.1): 记录后端冻结前验证标记'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
