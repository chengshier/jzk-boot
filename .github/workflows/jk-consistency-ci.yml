name: Jiuzhoukang consistency CI

on:
  push:
    branches:
      - fix/jk-business-consistency
  pull_request:
    branches:
      - master

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile all modules
        run: |
          set -o pipefail
          mvn -B -DskipTests compile 2>&1 | tee maven-compile.log
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-compile-log
          path: maven-compile.log
          retention-days: 7
