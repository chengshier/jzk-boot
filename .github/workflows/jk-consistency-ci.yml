name: Jiuzhoukang consistency CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jk-consistency-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build relevant source index
        run: |
          find crmeb-admin crmeb-front crmeb-common crmeb-service sql docs -type f \
            \( -path '*jiuzhoukang*' -o -path '*jkBusiness*' \) \
            | grep -Ei 'relation|receive|platform|transfer|health|commission|withdraw|menu|route' \
            | sort > source-index.txt
      - name: Upload source index
        uses: actions/upload-artifact@v4
        with:
          name: jk-source-index
          path: source-index.txt
          retention-days: 1

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile all modules
        run: |
          set -o pipefail
          mvn -B -DskipTests compile 2>&1 | tee maven-compile.log
      - name: Upload failed compile log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-compile-log
          path: maven-compile.log
          retention-days: 3
