name: Jiuzhoukang consistency CI

on:
  push:
    branches:
      - master
      - fix/jzk-v3.1-post-merge-hardening
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jk-consistency-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile all modules
        id: compile
        run: |
          set -o pipefail
          mvn -B -DskipTests compile 2>&1 | tee maven-compile.log
      - name: Upload failed compile log
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: maven-compile-log
          path: maven-compile.log
          retention-days: 3
      - name: Run ledger convergence regression tests
        id: ledger-tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl crmeb-service -am \
            -Dtest=JkPerformanceServiceImplTest,JkOperationProfitServiceImplTest,CommissionTriggerServiceImplTransferReturnTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false \
            test 2>&1 | tee ledger-regression-test.log
      - name: Upload failed ledger regression test log
        if: failure() && steps.ledger-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-regression-test-log
          path: ledger-regression-test.log
          retention-days: 3
