name: Jiuzhoukang consistency CI

on:
  push:
    branches:
      - fix/jk-business-consistency
  pull_request:
    branches:
      - master

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile all modules
        run: mvn -B -DskipTests compile
