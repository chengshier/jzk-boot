    username: gatherwit
    password: Wit@5685199@!!!
  redis:
#    host: 127.0.0.1 #地址
#    port: 6379 #端口
#    password:
#    timeout: 30000 # 连接超时时间（毫秒）
#    database: 6  #默认数据库
    host: hw.wit.cn
    port: 9999
    password: Wiot@xm@2022_
