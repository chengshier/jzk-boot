debug: true
logging:
  level:
    io.swagger.*: error
    com.zbjk.crmeb: debug
    org.springframework.boot.autoconfigure: ERROR
  config: classpath:logback-spring.xml
  file:
    path: ./crmeb_log

# mybatis 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*/*Mapper.xml #xml扫描，多个目录用逗号或者分号分隔（告诉 Mapper 所对应的 XML 文件位置）
  # 配置sql打印日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
#      logic-delete-field: isDel  #全局逻辑删除字段值 3.3.0开始支持，详情看下面。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)


# 行为验证码
aj:
  captcha:
    type: default       # 验证码类型
    water-mark: CRMEB Java   # 水印
    slip-offset: 15      # 校验滑动拼图允许误差偏移量(默认5像素)
    aes-status: true    # aes加密坐标开启或者禁用(true|false)
    interference-options: 2 # 滑动干扰项(0/1/2)
    font-style: 1       # 点选字体样式 默认Font.BOLD
    font-size: 25       # 点选字体字体大小
    req-frequency-limit-enable: false   # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5     # 验证失败5次，get接口锁定
    req-get-lock-seconds: 360   # 验证失败后，锁定时间间隔,s
    req-get-minute-limit: 30     # get接口一分钟内请求数限制
    req-check-minute-limit: 60    # check接口一分钟内请求数限制
    req-verify-minute-limit: 60     # verify接口一分钟内请求数限制

    # 滑动验证，底图路径，不配置将使用默认图片
    # 支持全路径
    # 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/jigsaw
    jigsaw: classpath:images/jigsaw
    #滑动验证，底图路径，不配置将使用默认图片
    ##支持全路径
    # 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/pic-click
    pic-click: classpath:images/pic-click
    # 对于分布式部署的应用，我们建议应用自己实现CaptchaCacheService，比如用Redis或者memcache，
    # 参考CaptchaCacheServiceRedisImpl.java
    # 如果应用是单点的，也没有使用redis，那默认使用内存。
    # 内存缓存只适合单节点部署的应用，否则验证码生产与验证在节点之间信息不同步，导致失败。
    # ！！！ 注意啦，如果应用有使用spring-boot-starter-data-redis，
    # 请打开CaptchaCacheServiceRedisImpl.java注释。
    # redis ----->  SPI： 在resources目录新建META-INF.services文件夹(两层)，参考当前服务resources。
    # 缓存local/redis...
    cache-type: redis
    # local缓存的阈值,达到这个值，清除缓存
    cache-number: 1000
    # local定时清除过期缓存(单位秒),设置为0代表不执行
    timing-clear: 3600

    history-data-clear-enable: false

#swagger 配置
swagger:
  basic:
    enable: true #是否开启
    check: false #是否打开验证
    username: #访问swagger的账号
    password: #访问swagger的密码
# 九州康第五阶段健康数据安全配置。
# 生产环境必须通过环境变量配置加密密钥和回调密钥；默认关闭设备回调，避免未验签数据入库。
jk:
  health:
    callback-enabled: ${JK_HEALTH_CALLBACK_ENABLED:false}
    callback-secret: ${JK_HEALTH_CALLBACK_SECRET:}
    data-encryption-key: ${JK_HEALTH_DATA_ENCRYPTION_KEY:awR7vEG2QHvswVFmE-8LfG1LSVoHHDj8CKUU-rfNBS4}
    allow-plaintext: ${JK_HEALTH_ALLOW_PLAINTEXT:false}
    # 失败回调自动重试默认关闭；完成真实设备联调后再开启。
    sync-auto-retry-enabled: ${JK_HEALTH_SYNC_AUTO_RETRY_ENABLED:false}
    sync-retry-cron: "${JK_HEALTH_SYNC_RETRY_CRON:0 */5 * * * ?}"
    # 0 表示暂不自动清理；正式上线前应结合合规要求确定保留期和归档策略。
    retention-days: ${JK_HEALTH_RETENTION_DAYS:0}
    archive-enabled: ${JK_HEALTH_ARCHIVE_ENABLED:false}
    sinocare:
      # 三诺回调验签/公钥解密的公钥、应用标识与 H5 地址均由部署环境注入，禁止写入生产配置仓库。
      app-id: ${JK_SINOCARE_APP_ID:mvwbl124t45d}
      public-key: ${JK_SINOCARE_PUBLIC_KEY:MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCq4TVj8QA/GD5KxYxTftS8PdqW4lFYn+2QmRdgsAX+5YmAnL4BvN0BSh4J2fBpyNuSno5rJ6Zl/uxy9Fv8jkfwkEJ3OZf6MJmaanWzMHZKIgqTq9cEMON0vz/lKaRxpIhckSo1XXKoitlmn/RQklpe8jVfx46Hqpbux/FeiY4bXwIDAQAB}
      authorization-h5-url: ${JK_SINOCARE_AUTHORIZATION_H5_URL:https://health.tmqyt.com/test/mobile/auth}
      # 只用于测试联调：输出字段结构、类型和数组长度，不输出任何健康数据值。
      debug-structure-enabled: ${JK_SINOCARE_DEBUG_STRUCTURE_ENABLED:true}
      # 授权完成后的回跳地址由服务端固定配置，禁止接受客户端传入，避免开放跳转。
      redirect-url: ${JK_SINOCARE_REDIRECT_URL:https://www.baidu.com}

