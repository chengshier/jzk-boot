# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-KY-v1.4 # 当前代码版本
  imagePath: /F:/newWorkSpace/cream-jzk/crmeb/ # 服务器图片路径配置 斜杠结尾
  asyncConfig: false #是否同步config表数据到redis

server:
  port: 8198

spring:
  profiles:
    #  配置的环境
    active: dev
    #  数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
#    url: jdbc:mysql://rm-bp1531qh1ibq560l5km.mysql.rds.aliyuncs.com:3306/crmeb_wit?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
#    username: gatherwit
#    password: Wit@5685199@!!!
    url: jdbc:mysql://localhost:3306/jzk-test?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password:
    timeout: 10000 # 连接超时时间（毫秒）
    database: 6 #默认数据库
    jedis:
      pool:
        max-active: 200 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 0 # 连接池中的最小空闲连接
        time-between-eviction-runs: -1 #逐出扫描的时间间隔(毫秒) 如果为负数,则不运行逐出线程, 默认-1
